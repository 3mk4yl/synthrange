[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthrange-observer-ui"
version = "0.1.0"
description = "Read-only SynthRange Observer UI for local run artifacts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "jinja2>=3.1",
  "markdown>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
synthrange-observer-ui = "observer_ui.app:main"

[tool.setuptools.packages.find]
include = ["observer_ui*"]
exclude = ["deploy*", "tests*"]

[tool.setuptools.package-data]
observer_ui = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
