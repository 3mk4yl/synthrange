<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">SynthRange capability compatibility model</title><desc id="desc">Target adapters expose capabilities. Playbooks require capabilities and components. The compatibility matcher verifies requirements, and a run brief binds compatible contracts to a concrete run.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#70829b"/></marker><marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#33d6c4"/></marker></defs><style>
  .bg{fill:#07111f}.plane{fill:#0b1728;stroke:#24344d;stroke-width:2}.card{fill:#111f33;stroke:#344963;stroke-width:2}.red{stroke:#ff647c}.blue{stroke:#5aa7ff}.cyan{stroke:#33d6c4}.violet{stroke:#aa8cff}.amber{stroke:#f6c75b}.title{fill:#f4f7fb;font:700 34px system-ui,sans-serif}.subtitle{fill:#9fb0c7;font:400 17px system-ui,sans-serif}.planeTitle{fill:#8194ad;font:700 14px system-ui,sans-serif;letter-spacing:2px}.label{fill:#f4f7fb;font:700 20px system-ui,sans-serif}.small{fill:#aebbd0;font:400 14px system-ui,sans-serif}.tiny{fill:#8ea0b9;font:400 12px system-ui,sans-serif}.edge{fill:none;stroke:#70829b;stroke-width:3}.edgeRed{fill:none;stroke:#ff647c;stroke-width:4}.edgeBlue{fill:none;stroke:#5aa7ff;stroke-width:4}.edgeViolet{fill:none;stroke:#aa8cff;stroke-width:3}.edgeCyan{fill:none;stroke:#33d6c4;stroke-width:3}.dash{stroke-dasharray:9 8}.pill{fill:#0a1525;stroke:#344963;stroke-width:1}.mono{fill:#b8c7db;font:500 13px ui-monospace,SFMono-Regular,Consolas,monospace}
</style><rect class="bg" width="1400" height="760"/><text class="title" x="70" y="62">Capability-based composition</text><text class="subtitle" x="70" y="91">Playbooks depend on portable capabilities, not hard-coded target names</text>
<rect class="card amber" x="70" y="145" width="380" height="420" rx="20"/><text class="planeTitle" x="100" y="181">TARGET ADAPTER</text><text class="label" x="100" y="220">OWASP Juice Shop</text><text class="small" x="100" y="249">targets/juice-shop/target.yaml</text>
<text class="small" x="100" y="296">Exposes</text><rect class="pill" x="100" y="315" width="170" height="34" rx="17"/><text class="mono" x="185" y="337" text-anchor="middle">web.http</text><rect class="pill" x="280" y="315" width="140" height="34" rx="17"/><text class="mono" x="350" y="337" text-anchor="middle">service.health</text><rect class="pill" x="100" y="360" width="235" height="34" rx="17"/><text class="mono" x="218" y="382" text-anchor="middle">telemetry.container-logs</text><rect class="pill" x="100" y="405" width="220" height="34" rx="17"/><text class="mono" x="210" y="427" text-anchor="middle">deployment.compose</text><rect class="pill" x="100" y="450" width="250" height="34" rx="17"/><text class="mono" x="225" y="472" text-anchor="middle">reset.container-recreate</text><text class="tiny" x="100" y="525">Also declares endpoints, telemetry, lifecycle, tools</text>
<rect class="card" x="950" y="145" width="380" height="420" rx="20"/><text class="planeTitle" x="980" y="181">PLAYBOOK</text><text class="label" x="980" y="220">Web Surface Discovery</text><text class="small" x="980" y="249">playbooks/red/.../playbook.yaml</text><text class="small" x="980" y="296">Requires capabilities</text><rect class="pill" x="980" y="315" width="170" height="34" rx="17"/><text class="mono" x="1065" y="337" text-anchor="middle">web.http</text><rect class="pill" x="1160" y="315" width="140" height="34" rx="17"/><text class="mono" x="1230" y="337" text-anchor="middle">service.health</text><text class="small" x="980" y="385">Requires components</text><rect class="pill" x="980" y="403" width="135" height="34" rx="17"/><text class="mono" x="1047" y="425" text-anchor="middle">observer</text><rect class="pill" x="1125" y="403" width="175" height="34" rx="17"/><text class="mono" x="1212" y="425" text-anchor="middle">traffic-proxy</text><text class="tiny" x="980" y="485">Also declares authority, phases, evidence, outputs</text><text class="tiny" x="980" y="510">and composition dependencies</text>
<circle cx="700" cy="350" r="118" fill="#0f2133" stroke="#33d6c4" stroke-width="3"/><text class="planeTitle" x="700" y="317" text-anchor="middle">COMPATIBILITY</text><text class="label" x="700" y="354" text-anchor="middle">required ⊆ exposed</text><text class="small" x="700" y="384" text-anchor="middle">components available</text><text class="small" x="700" y="410" text-anchor="middle">schema valid</text>
<path class="edge" d="M450 350 H575" marker-end="url(#arrow)"/><path class="edge" d="M950 350 H825" marker-end="url(#arrow)"/>
<rect class="card cyan" x="500" y="610" width="400" height="90" rx="18"/><text class="label" x="700" y="646" text-anchor="middle">Run brief binding</text><text class="small" x="700" y="673" text-anchor="middle">target + Red + Blue + shared playbooks + run ID</text><path class="edgeCyan" d="M700 468 V610" marker-end="url(#arrowCyan)"/>
<text class="tiny" x="70" y="725">Contract API: synthrange/v1alpha1</text><text class="tiny" x="1120" y="725">Validated by JSON Schema + tests</text></svg>