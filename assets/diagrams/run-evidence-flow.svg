<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">SynthRange run and evidence flow</title><desc id="desc">A run begins with run brief binding and shared evidence baseline. Red and Blue operate independently in parallel. Observer collects proxy, target, and participant artifacts, hashes the artifact index, and produces defensive outputs.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#70829b"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff647c"/></marker><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5aa7ff"/></marker><marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#aa8cff"/></marker></defs><style>
  .bg{fill:#07111f}.plane{fill:#0b1728;stroke:#24344d;stroke-width:2}.card{fill:#111f33;stroke:#344963;stroke-width:2}.red{stroke:#ff647c}.blue{stroke:#5aa7ff}.cyan{stroke:#33d6c4}.violet{stroke:#aa8cff}.amber{stroke:#f6c75b}.title{fill:#f4f7fb;font:700 34px system-ui,sans-serif}.subtitle{fill:#9fb0c7;font:400 17px system-ui,sans-serif}.planeTitle{fill:#8194ad;font:700 14px system-ui,sans-serif;letter-spacing:2px}.label{fill:#f4f7fb;font:700 20px system-ui,sans-serif}.small{fill:#aebbd0;font:400 14px system-ui,sans-serif}.tiny{fill:#8ea0b9;font:400 12px system-ui,sans-serif}.edge{fill:none;stroke:#70829b;stroke-width:3}.edgeRed{fill:none;stroke:#ff647c;stroke-width:4}.edgeBlue{fill:none;stroke:#5aa7ff;stroke-width:4}.edgeViolet{fill:none;stroke:#aa8cff;stroke-width:3}.edgeCyan{fill:none;stroke:#33d6c4;stroke-width:3}.dash{stroke-dasharray:9 8}.pill{fill:#0a1525;stroke:#344963;stroke-width:1}.mono{fill:#b8c7db;font:500 13px ui-monospace,SFMono-Regular,Consolas,monospace}
</style><rect class="bg" width="1400" height="800"/><text class="title" x="70" y="62">Run and evidence flow</text><text class="subtitle" x="70" y="91">Independent agent decisions, shared run identity, reproducible outputs</text>
<rect class="card cyan" x="70" y="145" width="260" height="100" rx="17"/><text class="planeTitle" x="200" y="175" text-anchor="middle">1 · BIND</text><text class="label" x="200" y="207" text-anchor="middle">Run brief</text><text class="small" x="200" y="230" text-anchor="middle">target · playbooks · authority</text>
<rect class="card violet" x="420" y="145" width="320" height="100" rx="17"/><text class="planeTitle" x="580" y="175" text-anchor="middle">2 · BASELINE</text><text class="label" x="580" y="207" text-anchor="middle">Shared evidence contract</text><text class="small" x="580" y="230" text-anchor="middle">run ID · health · artifact layout</text>
<path class="edgeCyan" d="M330 195 H420" marker-end="url(#arrow)"/>
<rect class="card red" x="190" y="335" width="360" height="145" rx="18"/><text class="planeTitle" x="370" y="368" text-anchor="middle">3A · RED</text><text class="label" x="370" y="403" text-anchor="middle">Web Surface Discovery</text><text class="small" x="370" y="430" text-anchor="middle">choose tactics · follow evidence</text><text class="tiny" x="370" y="456" text-anchor="middle">proxy-tagged requests + Red report</text>
<rect class="card blue" x="850" y="335" width="360" height="145" rx="18"/><text class="planeTitle" x="1030" y="368" text-anchor="middle">3B · BLUE</text><text class="label" x="1030" y="403" text-anchor="middle">Web Activity Triage</text><text class="small" x="1030" y="430" text-anchor="middle">baseline · correlate · assess</text><text class="tiny" x="1030" y="456" text-anchor="middle">triage + detections + defensive backlog</text>
<path class="edgeRed" d="M535 245 C490 280 410 285 380 335" marker-end="url(#arrowRed)"/><path class="edgeBlue" d="M625 245 C700 275 960 275 1020 335" marker-end="url(#arrowBlue)"/>
<rect class="card violet" x="500" y="545" width="400" height="125" rx="18"/><text class="planeTitle" x="700" y="578" text-anchor="middle">4 · COLLECT &amp; FINALIZE</text><text class="label" x="700" y="613" text-anchor="middle">Observer</text><text class="small" x="700" y="638" text-anchor="middle">timeline · proxy · target · agent artifacts</text><text class="tiny" x="700" y="660" text-anchor="middle">artifact-index.json with SHA-256 hashes</text>
<path class="edgeViolet" d="M370 480 C400 525 520 530 580 545" marker-end="url(#arrowViolet)"/><path class="edgeViolet" d="M1030 480 C1000 525 880 530 820 545" marker-end="url(#arrowViolet)"/>
<rect class="card" x="970" y="570" width="310" height="85" rx="16"/><text class="label" x="1125" y="604" text-anchor="middle">Defensive intelligence</text><text class="small" x="1125" y="630" text-anchor="middle">findings · detections · backlog</text><path class="edge" d="M900 612 H970" marker-end="url(#arrow)"/>
<rect class="card" x="120" y="570" width="300" height="85" rx="16"/><text class="label" x="270" y="604" text-anchor="middle">Reproducible record</text><text class="small" x="270" y="630" text-anchor="middle">metadata · timeline · reports · hashes</text><path class="edge" d="M500 612 H420" marker-end="url(#arrow)"/>
<rect class="pill" x="445" y="715" width="510" height="38" rx="19"/><text class="small" x="700" y="739" text-anchor="middle">Red and Blue complement each other; neither waits for a scripted cue</text></svg>