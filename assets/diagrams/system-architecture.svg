<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">SynthRange system architecture</title><desc id="desc">Human orchestration activates Red and Blue agents through playbooks. Red reaches the target through the Traffic Proxy, Blue has governed defender access, and Observer collects neutral evidence. Observer UI is read-only and currently a prototype.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#70829b"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff647c"/></marker><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5aa7ff"/></marker><marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#aa8cff"/></marker></defs>
<style>
  .bg{fill:#07111f}.plane{fill:#0b1728;stroke:#24344d;stroke-width:2}.card{fill:#111f33;stroke:#344963;stroke-width:2}.red{stroke:#ff647c}.blue{stroke:#5aa7ff}.cyan{stroke:#33d6c4}.violet{stroke:#aa8cff}.amber{stroke:#f6c75b}.title{fill:#f4f7fb;font:700 34px system-ui,sans-serif}.subtitle{fill:#9fb0c7;font:400 17px system-ui,sans-serif}.planeTitle{fill:#8194ad;font:700 14px system-ui,sans-serif;letter-spacing:2px}.label{fill:#f4f7fb;font:700 20px system-ui,sans-serif}.small{fill:#aebbd0;font:400 14px system-ui,sans-serif}.tiny{fill:#8ea0b9;font:400 12px system-ui,sans-serif}.edge{fill:none;stroke:#70829b;stroke-width:3}.edgeRed{fill:none;stroke:#ff647c;stroke-width:4}.edgeBlue{fill:none;stroke:#5aa7ff;stroke-width:4}.edgeViolet{fill:none;stroke:#aa8cff;stroke-width:3}.edgeCyan{fill:none;stroke:#33d6c4;stroke-width:3}.dash{stroke-dasharray:9 8}.pill{fill:#0a1525;stroke:#344963;stroke-width:1}.mono{fill:#b8c7db;font:500 13px ui-monospace,SFMono-Regular,Consolas,monospace}
</style><rect class="bg" width="1400" height="900"/><text class="title" x="70" y="62">SynthRange system architecture</text><text class="subtitle" x="70" y="91">Agent-framework independent roles, explicit traffic paths, neutral evidence</text>
<rect class="plane" x="55" y="120" width="1290" height="150" rx="20"/><text class="planeTitle" x="80" y="151">CONTROL</text>
<rect class="card cyan" x="120" y="170" width="300" height="70" rx="14"/><text class="label" x="270" y="200" text-anchor="middle">Human operator</text><text class="small" x="270" y="224" text-anchor="middle">scope · authority · stop</text>
<rect class="card" x="550" y="170" width="300" height="70" rx="14"/><text class="label" x="700" y="200" text-anchor="middle">Run brief</text><text class="small" x="700" y="224" text-anchor="middle">targets · playbooks · bindings</text>
<rect class="card" x="980" y="170" width="300" height="70" rx="14"/><text class="label" x="1130" y="200" text-anchor="middle">Repository</text><text class="small" x="1130" y="224" text-anchor="middle">contracts · adapters · integrations</text>
<path class="edgeCyan" d="M420 205 H550" marker-end="url(#arrow)"/><path class="edge" d="M980 205 H850" marker-end="url(#arrow)"/>
<rect class="plane" x="55" y="290" width="1290" height="205" rx="20"/><text class="planeTitle" x="80" y="321">AGENTS</text>
<rect class="card red" x="220" y="350" width="360" height="105" rx="16"/><text class="label" x="400" y="386" text-anchor="middle">Red agent</text><text class="small" x="400" y="412" text-anchor="middle">adversarial playbook</text><text class="tiny" x="400" y="435" text-anchor="middle">tactical autonomy inside run authority</text>
<rect class="card blue" x="820" y="350" width="360" height="105" rx="16"/><text class="label" x="1000" y="386" text-anchor="middle">Blue agent</text><text class="small" x="1000" y="412" text-anchor="middle">defensive playbook</text><text class="tiny" x="1000" y="435" text-anchor="middle">baseline · triage · detections · advice</text>
<path class="edge" d="M650 240 C610 290 480 295 430 350" marker-end="url(#arrow)"/><path class="edge" d="M750 240 C790 290 920 295 970 350" marker-end="url(#arrow)"/>
<rect class="plane" x="55" y="515" width="1290" height="155" rx="20"/><text class="planeTitle" x="80" y="546">TARGET &amp; MEDIATION</text>
<rect class="card red" x="180" y="570" width="290" height="70" rx="14"/><text class="label" x="325" y="600" text-anchor="middle">Traffic Proxy</text><text class="small" x="325" y="624" text-anchor="middle">HTTP evidence · policy</text>
<rect class="card amber" x="810" y="570" width="350" height="70" rx="14"/><text class="label" x="985" y="600" text-anchor="middle">Target adapter</text><text class="small" x="985" y="624" text-anchor="middle">Juice Shop · Linux · Windows · macOS</text>
<path class="edgeRed" d="M400 455 V530 H325 V570" marker-end="url(#arrowRed)"/><path class="edgeRed" d="M470 605 H810" marker-end="url(#arrowRed)"/><text class="tiny" x="640" y="593" text-anchor="middle">declared adversarial path</text>
<path class="edgeBlue" d="M1000 455 V570" marker-end="url(#arrowBlue)"/><text class="tiny" x="1015" y="526">governed defender access</text>
<rect class="plane" x="55" y="690" width="1290" height="155" rx="20"/><text class="planeTitle" x="80" y="721">EVIDENCE</text>
<rect class="card violet" x="450" y="745" width="390" height="70" rx="14"/><text class="label" x="645" y="775" text-anchor="middle">Observer</text><text class="small" x="645" y="799" text-anchor="middle">timeline · health · artifacts · hashes</text>
<rect class="card violet" x="960" y="745" width="270" height="70" rx="14"/><text class="label" x="1095" y="775" text-anchor="middle">Observer UI</text><text class="small" x="1095" y="799" text-anchor="middle">read-only prototype</text>
<path class="edgeViolet" d="M325 640 V700 Q325 780 450 780" marker-end="url(#arrowViolet)"/><path class="edgeViolet" d="M985 640 V700 Q985 730 840 780" marker-end="url(#arrowViolet)"/><path class="edgeViolet dash" d="M840 780 H960" marker-end="url(#arrowViolet)"/>
<path class="edgeViolet dash" d="M400 455 C400 520 560 650 600 745" marker-end="url(#arrowViolet)"/><path class="edgeViolet dash" d="M1000 455 C1000 520 760 650 700 745" marker-end="url(#arrowViolet)"/>
<text class="tiny" x="87" y="874">Solid lines: operational paths</text><text class="tiny" x="310" y="874">Dashed violet: reports, transcripts, and read-only views</text><text class="tiny" x="1110" y="874">Observer runs no agent</text></svg>